<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diario Allenamenti</title>
<style>
:root{--bg:#04050d;--card:rgba(20,24,52,.55);--ink:#eaedff;--mute:#9aa4d8;--line:rgba(150,160,255,.22);--acc:#7c5cff;--acc2:#27e0ff;--warm:#ffb454;--soft:rgba(255,255,255,.07);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(60% 40% at 15% 8%,rgba(124,92,255,.4),transparent 70%),radial-gradient(50% 35% at 95% 55%,rgba(39,224,255,.2),transparent 70%),radial-gradient(55% 40% at 5% 100%,rgba(255,80,170,.2),transparent 70%),#04050d}
.sky i{position:absolute;inset:0}
.sky i:nth-child(1){background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 140px,#dfe8ff,transparent),radial-gradient(1.5px 1.5px at 160px 70px,#fff,transparent);background-size:200px 200px;animation:d1 120s linear infinite;opacity:.85}
.sky i:nth-child(2){background-image:radial-gradient(2px 2px at 60px 90px,#9fd8ff,transparent),radial-gradient(2px 2px at 190px 200px,#ffd9f5,transparent);background-size:310px 310px;animation:d2 80s linear infinite,tw 4s ease-in-out infinite}
.sky b{position:absolute;top:10%;left:-15%;width:130px;height:2px;background:linear-gradient(90deg,transparent,#fff);opacity:0;animation:shoot 9s 2s infinite}
.sky b+b{top:48%;animation-delay:6s;animation-duration:13s}
@keyframes d1{to{background-position:0 400px}}
@keyframes d2{to{background-position:0 620px}}
@keyframes tw{50%{opacity:.4}}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(25deg)}3%{opacity:1}12%{opacity:0;transform:translate(75vw,35vw) rotate(25deg)}100%{opacity:0}}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav h1{font-size:1.15rem;margin:0;text-align:center;flex:1;text-transform:capitalize}
button,input,select{font:inherit;color:inherit}
.ic{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1.3rem;cursor:pointer;backdrop-filter:blur(8px)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.stat{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;backdrop-filter:blur(8px);transform:perspective(600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s}
.stat::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.stat b{display:block;font-size:1.7rem;line-height:1.15;text-shadow:0 0 18px rgba(124,92,255,.8);font-variant-numeric:tabular-nums}
.stat span{color:var(--mute);font-size:.85rem}
.stat small{display:block;color:var(--mute);font-size:.72rem}
.bar{height:4px;border-radius:4px;background:var(--soft);margin-top:6px;overflow:hidden}
.bar u{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tabs button{border:0;background:none;padding:10px 4px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--mute)}
.tabs button[aria-pressed="true"]{background:linear-gradient(135deg,var(--acc),#4f8dff);color:#fff;box-shadow:0 0 16px rgba(124,92,255,.7)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;backdrop-filter:blur(8px)}
.row{display:flex;gap:8px;margin-bottom:8px}
.row>*{flex:1;min-width:0}
input,select{width:100%;padding:11px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.06)}
input::placeholder{color:var(--mute)}
option{background:#12163a;color:#eaedff}
.go{width:100%;padding:12px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--acc),#4f8dff 55%,var(--acc2));color:#fff;font-weight:700;cursor:pointer;box-shadow:0 6px 20px -6px rgba(124,92,255,.9),0 3px 0 rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.hint{color:var(--acc2);font-size:.82rem;margin:0 0 8px;min-height:1.2em}
h2{font-size:.95rem;margin:16px 0 6px;color:var(--mute)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item div{flex:1;min-width:0}
.item small{display:block;color:var(--mute)}
.item em{font-style:normal;font-weight:700}
.item .w{color:var(--warm)}
.x{border:0;background:none;color:var(--mute);font-size:1.3rem;cursor:pointer;width:36px;height:36px}
.empty{color:var(--mute);margin:8px 0 0}
.note{color:var(--mute);font-size:.8rem;margin-top:18px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.hero{display:flex;align-items:center;gap:18px;padding:16px;border-radius:22px;background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(39,224,255,.1));border:1px solid var(--line);backdrop-filter:blur(10px);margin-bottom:14px;box-shadow:0 14px 40px -16px rgba(124,92,255,.9),inset 0 1px 0 rgba(255,255,255,.15)}
.hero strong{display:block;font-size:1.25rem;background:linear-gradient(90deg,#fff,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero span{display:block;font-size:.85rem;color:var(--mute)}
.hero .odo{margin-top:6px;color:var(--acc2);font-weight:700}
.scene{width:96px;height:96px;perspective:500px;flex:none}
.sys{width:100%;height:100%;position:relative;transform-style:preserve-3d;transform:rotateX(-12deg);animation:fl 6s ease-in-out infinite}
.planet{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#b9f3ff,#6a4cff 50%,#160a46);box-shadow:0 0 28px rgba(124,92,255,.8),inset -8px -6px 14px rgba(0,0,0,.55);overflow:hidden}
.planet::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,.15) 0 6px,transparent 6px 16px);animation:bd 3s linear infinite}
.ring,.orbit{position:absolute;left:50%;top:50%;width:92px;height:92px;margin:-46px;border-radius:50%;transform-style:preserve-3d;transform:rotateX(76deg) rotateY(-14deg)}
.ring{border:4px solid rgba(255,196,120,.75);box-shadow:0 0 12px rgba(255,180,84,.5)}
.orbit{animation:oz 5s linear infinite}
.orbit i{position:absolute;top:-5px;left:50%;margin-left:-5px;width:10px;height:10px;border-radius:50%;background:var(--acc2);box-shadow:0 0 12px var(--acc2),0 0 24px var(--acc2)}
@keyframes fl{50%{transform:rotateX(-12deg) translateY(-4px)}}
@keyframes bd{to{background-position:32px 0}}
@keyframes oz{to{transform:rotateX(76deg) rotateY(-14deg) rotateZ(360deg)}}
.go3d .stat{animation:flip .7s cubic-bezier(.2,.8,.2,1) backwards;transform-origin:50% 100%}
.go3d .stat:nth-child(2){animation-delay:.1s}.go3d .stat:nth-child(3){animation-delay:.2s}.go3d .stat:nth-child(4){animation-delay:.3s}
@keyframes flip{from{opacity:0;transform:perspective(500px) rotateX(-75deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s .2s forwards}
@media (prefers-reduced-motion:reduce){.sky i,.sky b,.sys,.planet::after,.orbit,.go3d .stat,.draw{animation:none}.draw{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="sky"><i></i><i></i><b></b><b></b></div>
<main id="app"></main>
<script>
var KEY='diario-v1';
var S={food:[],work:[],weight:[],goal:0};
function key(d){var z=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
try{var raw=localStorage.getItem(KEY);if(raw){S=Object.assign(S,JSON.parse(raw))}else{S.weight.push({id:1,d:key(new Date()),kg:87})}}catch(e){S.weight.push({id:1,d:key(new Date()),kg:87})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var day=key(new Date()),tab='cibo',anim=true;
var FOODS='Pasta (cotta)|158|200;Pasta (cruda)|350|80;Riso (cotto)|130|180;Riso (crudo)|350|80;Pane|270|50;Pane integrale|250|50;Fette biscottate|400|30;Pizza margherita|270|350;Patate lesse|86|200;Patatine fritte|312|100;Pollo petto cotto|165|150;Manzo magro|150|150;Hamburger|250|120;Prosciutto cotto|215|50;Prosciutto crudo|250|50;Bresaola|150|50;Salame|400|30;Tonno al naturale|100|80;Salmone|208|150;Merluzzo|82|150;Uova|143|60;Latte intero|64|200;Latte parzialmente scremato|46|200;Yogurt greco|97|125;Parmigiano|392|20;Mozzarella|253|125;Ricotta|150|100;Fagioli cotti|100|150;Lenticchie cotte|116|150;Ceci cotti|120|150;Insalata|15|100;Pomodori|18|150;Zucchine|17|200;Carote|41|100;Spinaci|23|150;Mela|52|180;Banana|89|120;Arancia|47|200;Pera|57|180;Fragole|33|150;Uva|69|150;Kiwi|61|100;Avocado|160|100;Noci|654|30;Mandorle|600|30;Olio d\'oliva|884|10;Burro|717|10;Fiocchi d\'avena|370|40;Cereali|380|40;Biscotti|430|30;Cornetto|400|60;Cioccolato fondente|546|20;Crema di nocciole|540|20;Miele|304|15;Zucchero|390|5;Gelato|200|100;Cappuccino|55|150;Coca-Cola|42|330;Birra|43|330;Vino|83|125;Succo di frutta|45|200;Caffè|2|30'.split(';').map(function(s){var p=s.split('|');return{n:p[0],k:+p[1],p:+p[2]}});
var FL=FOODS.map(function(f){return'<option value="'+f.n.replace(/"/g,'&quot;')+'">'}).join('');
function findFood(n){n=n.trim().toLowerCase();if(!n)return null;var m=FOODS.filter(function(f){return f.n.toLowerCase()===n});if(m.length)return m[0];var c=FOODS.filter(function(f){return f.n.toLowerCase().indexOf(n)===0});return c.length===1?c[0]:null}
function streak(){var d=new Date(),c=0,days={};S.work.forEach(function(x){days[x.d]=1});if(!days[key(d)])d.setDate(d.getDate()-1);while(days[key(d)]){c++;d.setDate(d.getDate()-1)}return c}
function heroHtml(){var s=streak(),tp=S.work.reduce(function(a,x){return a+(x.ped||0)},0);
  return '<div class="hero"><div class="scene"><div class="sys"><div class="planet"></div><div class="ring"></div><div class="orbit"><i></i></div></div></div><div><strong>Diario allenamenti</strong><span>'+(s?s+(s===1?' giorno':' giorni')+' di fila con un allenamento':'Registra un allenamento per iniziare la serie')+'</span><span class="odo">'+fmt(tp)+' pedalate totali</span></div></div>'}
function chart(ws){if(ws.length<2)return '<p class="empty">Registra almeno due pesi per vedere il grafico.</p>';
  var ks=ws.map(function(x){return x.kg}),mn=Math.min.apply(null,ks)-.5,mx=Math.max.apply(null,ks)+.5,W=300,H=120,P=10;
  var pts=ws.map(function(x,i){return[P+i*(W-2*P)/(ws.length-1),P+(mx-x.kg)/(mx-mn)*(H-2*P)]});
  var line=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ');
  return '<div class="box"><svg viewBox="0 0 300 120" width="100%" role="img" aria-label="Andamento del peso"><polygon points="'+P+','+(H-P)+' '+line+' '+(W-P)+','+(H-P)+'" fill="var(--acc)" opacity=".2"/><polyline class="draw" pathLength="1" points="'+line+'" fill="none" stroke="var(--acc2)" stroke-width="2.5" stroke-linejoin="round" style="filter:drop-shadow(0 0 4px var(--acc2))"/>'+pts.map(function(p){return'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5" fill="var(--acc2)"/>'}).join('')+'</svg></div>'}
var MEALS=['Colazione','Pranzo','Cena','Spuntino'];
var MET={Cyclette:6.8,Corsa:9,Camminata:3.8,Altro:5};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function num(v){var x=parseFloat(String(v).replace(',','.'));return isFinite(x)&&x>0?x:0}
function fmt(x,d){return x.toLocaleString('it-IT',{maximumFractionDigits:d||0})}
function sortedW(){return S.weight.slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:a.id-b.id})}
function lastKg(){var w=sortedW();return w.length?w[w.length-1].kg:87}
function uid(){return Date.now()+Math.floor(Math.random()*1000)}
function val(id){var e=document.getElementById(id);return e?e.value:''}

function render(){
  var f=S.food.filter(function(x){return x.d===day}),w=S.work.filter(function(x){return x.d===day});
  var eat=f.reduce(function(a,x){return a+x.kcal},0),out=w.reduce(function(a,x){return a+x.kcal},0),pd=w.reduce(function(a,x){return a+(x.ped||0)},0);
  var today=key(new Date()),lim=new Date();lim.setDate(lim.getDate()-6);var lk=key(lim);
  var pw=S.work.filter(function(x){return x.d>=lk&&x.d<=today}).reduce(function(a,x){return a+(x.ped||0)},0);
  var lab=new Date(day+'T12:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
  var h=heroHtml()+'<div class="nav"><button class="ic" data-a="prev" aria-label="Giorno precedente">‹</button><h1>'+(day===today?'Oggi, ':'')+esc(lab)+'</h1><button class="ic" data-a="next" aria-label="Giorno successivo">›</button></div>';
  h+='<div class="stats'+(anim?' go3d':'')+'"><div class="stat"><b>'+fmt(eat)+'</b><span>kcal mangiate</span>'+(S.goal?'<small>obiettivo '+fmt(S.goal)+'</small><div class="bar"><u style="width:'+Math.min(100,Math.round(eat/S.goal*100))+'%"></u></div>':'')+'</div>';
  h+='<div class="stat"><b>'+fmt(out)+'</b><span>kcal bruciate</span></div>';
  h+='<div class="stat"><b>'+fmt(eat-out)+'</b><span>bilancio</span></div>';
  h+='<div class="stat"><b>'+fmt(pd)+'</b><span>pedalate</span><small>ultimi 7 giorni: '+fmt(pw)+'</small></div></div>';
  h+='<div class="tabs">';
  [['cibo','Cibo'],['all','Allenamento'],['peso','Peso']].forEach(function(t){h+='<button data-a="tab" data-v="'+t[0]+'" aria-pressed="'+(tab===t[0])+'">'+t[1]+'</button>'});
  h+='</div>';
  if(tab==='cibo'){
    h+='<div class="box"><div class="row"><input id="fn" list="fl" autocomplete="off" placeholder="Cerca alimento (es. pasta, mela)"></div><datalist id="fl">'+FL+'</datalist>';
    h+='<div class="row"><select id="meal">'+MEALS.map(function(m){return'<option>'+m+'</option>'}).join('')+'</select><input id="fg" inputmode="numeric" placeholder="Grammi"></div>';
    h+='<div class="row"><input id="fk" inputmode="numeric" placeholder="kcal (si calcolano da sole)"></div><p class="hint" id="fh"></p><button class="go" data-a="addFood">Aggiungi cibo</button></div>';
    if(!f.length)h+='<p class="empty">Nessun pasto registrato per questo giorno.</p>';
    MEALS.forEach(function(m){var l=f.filter(function(x){return x.meal===m});if(!l.length)return;
      h+='<h2>'+m+' · '+fmt(l.reduce(function(a,x){return a+x.kcal},0))+' kcal</h2><div class="box" style="margin-top:0">';
      l.forEach(function(x){h+='<div class="item"><div>'+esc(x.name)+(x.g?'<small>'+fmt(x.g)+' g</small>':'')+'</div><em>'+fmt(x.kcal)+'</em><button class="x" data-a="del" data-t="food" data-id="'+x.id+'" aria-label="Elimina">×</button></div>'});
      h+='</div>'});
  }
  if(tab==='all'){
    var wk=S.work.filter(function(x){return x.d>=lk&&x.d<=today}).reduce(function(a,x){return a+x.min},0);
    h+='<div class="box"><div class="row"><select id="wt"><option>Cyclette</option><option>Corsa</option><option>Camminata</option><option>Altro</option></select><input id="wm" inputmode="numeric" placeholder="Minuti"></div>';
    h+='<div class="row"><input id="wk" inputmode="decimal" placeholder="Km (facoltativo)"><input id="wp" inputmode="numeric" placeholder="Pedalate"></div>';
    h+='<div class="row"><input id="wc" inputmode="numeric" placeholder="kcal (se vuoto, stima)"></div><button class="go" data-a="addWork">Aggiungi allenamento</button></div>';
    h+='<p class="empty">Ultimi 7 giorni: '+fmt(wk)+' minuti di allenamento.</p>';
    if(!w.length)h+='<p class="empty">Nessun allenamento registrato per questo giorno.</p>';
    else{h+='<div class="box">';w.forEach(function(x){h+='<div class="item"><div>'+esc(x.type)+'<small>'+fmt(x.min)+' min'+(x.km?' · '+fmt(x.km,2)+' km':'')+(x.ped?' · '+fmt(x.ped)+' pedalate · '+fmt(x.ped/x.min)+'/min':'')+'</small></div><em class="w">'+(x.est?'~':'')+fmt(x.kcal)+' kcal</em><button class="x" data-a="del" data-t="work" data-id="'+x.id+'" aria-label="Elimina">×</button></div>'});h+='</div>'}
  }
  if(tab==='peso'){
    var ws=sortedW(),first=ws.length?ws[0].kg:0;
    h+='<div class="box"><div class="row"><input id="kg" inputmode="decimal" placeholder="Peso in kg"></div><button class="go" data-a="addW">Registra peso</button></div>';
    h+='<div class="box"><label for="goal" class="empty" style="margin:0 0 6px;display:block">Obiettivo kcal giornaliere (facoltativo)</label><div class="row" style="margin:0"><input id="goal" inputmode="numeric" value="'+(S.goal||'')+'"><button class="go" data-a="goal" style="flex:0 0 auto;width:auto;padding:0 16px">Salva</button></div></div>';
    h+=chart(ws);h+='<h2>Storico peso</h2><div class="box" style="margin-top:0">';
    ws.slice().reverse().forEach(function(x){var dl=x.kg-first,dt=Math.abs(dl)<0.05?'':' · '+(dl<0?'−':'+')+fmt(Math.abs(dl),1)+' kg dall’inizio';
      h+='<div class="item"><div>'+fmt(x.kg,1)+' kg<small>'+new Date(x.d+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})+dt+'</small></div><button class="x" data-a="del" data-t="weight" data-id="'+x.id+'" aria-label="Elimina">×</button></div>'});
    h+='</div>';
    h+='<div class="box"><div class="row"><button class="go" data-a="exp">Esporta backup</button><button class="go" data-a="imp">Importa backup</button></div><input id="imp" type="file" accept="application/json" hidden></div>';
  }
  h+='<p class="note">I dati restano salvati su questo dispositivo, nel browser in cui apri la pagina. Le kcal degli alimenti sono valori medi indicativi per 100 g. La stima delle kcal bruciate usa il tuo ultimo peso registrato.</p>';
  document.getElementById('app').innerHTML=h;anim=false;
}

function shift(n){var d=new Date(day+'T12:00:00');d.setDate(d.getDate()+n);day=key(d)}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;
  if(a==='prev'){shift(-1);anim=true}
  else if(a==='next'){shift(1);anim=true}
  else if(a==='tab')tab=b.dataset.v;
  else if(a==='addFood'){var k=num(val('fk')),nm=val('fn').trim(),g=num(val('fg'));if(!k||!nm){alert('Inserisci cosa hai mangiato e i grammi (o le kcal).');return}S.food.push({id:uid(),d:day,meal:val('meal'),name:nm,kcal:Math.round(k),g:Math.round(g)})}
  else if(a==='addWork'){var m=num(val('wm'));if(!m){alert('Inserisci i minuti di allenamento.');return}var t=val('wt'),kc=num(val('wc'));
    S.work.push({id:uid(),d:day,type:t,min:Math.round(m),km:num(val('wk')),ped:Math.round(num(val('wp'))),kcal:kc?Math.round(kc):Math.round(MET[t]*lastKg()*m/60),est:!kc})}
  else if(a==='addW'){var kg=num(val('kg'));if(!kg){alert('Inserisci il peso in kg.');return}S.weight.push({id:uid(),d:day,kg:kg})}
  else if(a==='goal'){S.goal=Math.round(num(val('goal')))}
  else if(a==='exp'){var bl=new Blob([JSON.stringify(S)],{type:'application/json'}),u=URL.createObjectURL(bl),l=document.createElement('a');l.href=u;l.download='diario-backup-'+key(new Date())+'.json';l.click();setTimeout(function(){URL.revokeObjectURL(u)},1000);return}
  else if(a==='imp'){document.getElementById('imp').click();return}
  else if(a==='del'){var t2=b.dataset.t,id=+b.dataset.id;S[t2]=S[t2].filter(function(x){return x.id!==id})}
  save();render();
});
document.addEventListener('input',function(e){
  var id=e.target.id;if(id!=='fn'&&id!=='fg')return;
  var fg=document.getElementById('fg'),fk=document.getElementById('fk'),hi=document.getElementById('fh'),nm=val('fn').trim(),f=findFood(nm);
  if(id==='fg')delete fg.dataset.auto;
  if(!f){hi.textContent=nm?'Alimento non in elenco: scrivi tu le kcal.':'';return}
  if(id==='fn'&&(!fg.value||fg.dataset.auto)){fg.value=f.p;fg.dataset.auto='1'}
  var g=num(fg.value),kc=Math.round(f.k*g/100);
  if(g)fk.value=kc;
  hi.textContent=f.k+' kcal ogni 100 g'+(g?' → '+kc+' kcal':'');
});
document.addEventListener('pointermove',function(e){var c=e.target.closest&&e.target.closest('.stat');if(!c)return;var r=c.getBoundingClientRect();c.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*14+'deg');c.style.setProperty('--rx',-((e.clientY-r.top)/r.height-.5)*14+'deg')});
document.addEventListener('pointerout',function(e){var c=e.target.closest&&e.target.closest('.stat');if(c){c.style.removeProperty('--rx');c.style.removeProperty('--ry')}});
document.addEventListener('change',function(e){if(e.target.id!=='imp'||!e.target.files[0])return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!Array.isArray(o.food)||!Array.isArray(o.work)||!Array.isArray(o.weight))throw 0;S=Object.assign({food:[],work:[],weight:[],goal:0},o);save();render();alert('Backup importato.')}catch(x){alert('File di backup non valido.')}};r.readAsText(e.target.files[0])});
render();
</script>
